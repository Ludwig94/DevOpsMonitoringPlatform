services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: monitoring-db
    environment:
      SA_PASSWORD: "Monitor@12345"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Monitor@12345", "-Q", "SELECT 1", "-C"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

  api:
    build:
      context: ./Monitoring.Api
      dockerfile: Dockerfile
    container_name: monitoring-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=DevOpsMonitoringDb;User Id=sa;Password=Monitor@12345;TrustServerCertificate=True"
      CORS_ORIGINS: "http://localhost:4200"
    ports:
      - "5158:5158"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./monitoring-dashboard
      dockerfile: Dockerfile
    container_name: monitoring-frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqldata:
